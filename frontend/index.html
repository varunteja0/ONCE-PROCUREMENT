<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP-TODO: script-src still keeps 'unsafe-inline' because of the inline
      theme-bootstrap <script> below (prevents FOUC on first paint). Cleanup
      path: move that script into a hashed asset emitted by Vite and switch
      script-src to 'self' + the SHA-256 hash. 'unsafe-eval' has been
      removed. style-src keeps 'unsafe-inline' for Tailwind.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#225ad8" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Once — supplier-portal submission autopilot for US specialty insurance MGAs. Submit once. Prove it forever."
    />
    <meta property="og:title" content="Once Procurement" />
    <meta
      property="og:description"
      content="Submit once. Prove it forever. The submission autopilot for US specialty insurance MGAs."
    />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <title>Once Procurement</title>
    <script>
      // Inline theme bootstrap — runs before React mounts so the first paint
      // honours the persisted theme and avoids a light→dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('once.theme');
          var theme = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = theme === 'dark' || (theme === 'system' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="visually-hidden focus:not-sr-only">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
