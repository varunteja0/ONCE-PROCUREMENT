<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Applied Epic — New Submission</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<header class="bg-emerald-700"><h1>Applied Epic Producer Portal</h1><span style="font-size:12px;opacity:0.85">New Submission</span></header>
<div class="layout">
  <nav class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="new-submission.html" data-action="new-submission">New Submission</a>
  </nav>
  <main>
    <div class="card" id="form-card">
      <h2 style="margin-top:0">New Application</h2>
      <div id="form-error" class="error" style="display:none"></div>
      <form id="submission-form" novalidate>
        <label for="named_insured" class="required">Account Name</label>
        <input id="named_insured" name="named_insured" type="text" required>
        <label for="account_number" class="required">Account Number</label>
        <input id="account_number" name="account_number" type="text" required>
        <label for="fein" class="required">FEIN</label>
        <input id="fein" name="fein" type="text" required>
        <label for="effective_date" class="required">Effective Date</label>
        <input id="effective_date" name="effective_date" type="date" required>
        <label for="line_of_business" class="required">Line of Business</label>
        <input id="line_of_business" name="line_of_business" type="text" required>
        <label for="premium" class="required">Premium</label>
        <input id="premium" name="premium" type="text" required>
        <label for="producer" class="">Producer</label>
        <input id="producer" name="producer" type="text" >

        <button type="submit" data-action="submit-application">Submit Application</button>
      </form>
    </div>
    <div class="card" id="drift-card" style="display:none">
      <h2 style="margin-top:0">Maintenance</h2>
      <p>The new-submission form is temporarily unavailable. Please retry later.</p>
    </div>
  </main>
</div>
<script src="submit.js"></script>
</body></html>
