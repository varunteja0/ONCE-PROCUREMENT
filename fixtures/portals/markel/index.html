<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Markel Portal — Sign in</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<header class="bg-blue-700"><h1>Markel Producer Portal</h1><span style="font-size:12px;opacity:0.85">v2026.01 — FIXTURE</span></header>
<main style="display:flex;justify-content:center;padding-top:80px;">
  <div class="card" style="width:380px;">
    <h2 style="margin-top:0">Sign in</h2>
    <p style="color:#64748b;font-size:13px;">Fixture credentials: <code>demo</code> / <code>demo</code></p>
    <div id="auth-error" class="error" style="display:none">Invalid credentials.</div>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</main>
<script src="login.js"></script>
</body></html>
