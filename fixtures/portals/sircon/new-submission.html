<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sircon — New License Application</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<header class="bg-blue-700"><h1>Sircon — Producer Licensing</h1><span style="font-size:12px;opacity:0.85">New License Application</span></header>
<div class="layout">
  <nav class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="new-submission.html" data-action="new-submission">New Submission</a>
  </nav>
  <main>
    <div class="card" id="form-card">
      <h2 style="margin-top:0">New License Application</h2>
      <div id="form-error" class="error" style="display:none"></div>
      <form id="submission-form" novalidate>
        <label for="legal_name" class="required">Producer Legal Name</label>
        <input id="legal_name" name="legal_name" type="text" required>
        <label for="ein" class="required">Tax ID (EIN)</label>
        <input id="ein" name="ein" type="text" required>
        <label for="npn" class="required">NPN</label>
        <input id="npn" name="npn" type="text" required>
        <label for="license_states" class="required">Requested License States</label>
        <input id="license_states" name="license_states" type="text" placeholder="NY,NJ,CT" required>
        <label for="agency_name" class="">Agency Name</label>
        <input id="agency_name" name="agency_name" type="text" >

        <button type="submit" data-action="submit-application">Submit Application</button>
      </form>
    </div>
    <div class="card" id="drift-card" style="display:none">
      <h2 style="margin-top:0">Maintenance</h2>
      <p>The new-license form is temporarily unavailable. Please retry later.</p>
    </div>
  </main>
</div>
<script src="submit.js"></script>
</body></html>
