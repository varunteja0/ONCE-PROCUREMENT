# Once portal fixtures — single nginx serving 4 carrier sandboxes.
# Each portal binds a dedicated listen port to isolate them from one another
# (so the integration tests' env vars cleanly map 1:1 to URLs) and the same
# directory is mounted at /usr/share/nginx/html. The "X-Fixture-Portal" header
# is for log correlation.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 30s;
  access_log    /var/log/nginx/access.log;
  error_log     /var/log/nginx/error.log warn;

  # Block direct outbound captcha JS even though it's an iframe src in our
  # fixtures — keeps the box hermetic.
  server_tokens off;

  # AmTrust  ───────────────────────────────────────────────────────────────
  server {
    listen 8101 default_server;
    server_name _;
    root /usr/share/nginx/html/amtrust;
    index index.html;
    add_header X-Fixture-Portal "amtrust" always;
    location / { try_files $uri $uri/ /index.html; }
  }

  # Markel  ────────────────────────────────────────────────────────────────
  server {
    listen 8102;
    server_name _;
    root /usr/share/nginx/html/markel;
    index index.html;
    add_header X-Fixture-Portal "markel" always;
    location / { try_files $uri $uri/ /index.html; }
  }

  # Applied Epic  ──────────────────────────────────────────────────────────
  server {
    listen 8103;
    server_name _;
    root /usr/share/nginx/html/applied-epic;
    index index.html;
    add_header X-Fixture-Portal "applied-epic" always;
    location / { try_files $uri $uri/ /index.html; }
  }

  # Vertafore AMS360  ──────────────────────────────────────────────────────
  server {
    listen 8104;
    server_name _;
    root /usr/share/nginx/html/vertafore-ams360;
    index index.html;
    add_header X-Fixture-Portal "vertafore-ams360" always;
    location / { try_files $uri $uri/ /index.html; }
  }

  # Vertafore Sircon (producer licensing)  ─────────────────────────────────
  server {
    listen 8105;
    server_name _;
    root /usr/share/nginx/html/sircon;
    index index.html;
    add_header X-Fixture-Portal "sircon" always;
    location / { try_files $uri $uri/ /index.html; }
  }
}
