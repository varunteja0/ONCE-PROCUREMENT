server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      # Parse JSON log lines emitted by the Once backend. Extract canonical
      # fields into Loki labels (bounded cardinality) and leave the rest in
      # the line for full-text search.
      - json:
          expressions:
            level: level
            request_id: request_id
            tenant_id: tenant_id
            route: route_template
            status: status
            service: service
      - labels:
          level:
          service:
          route:
          status:
