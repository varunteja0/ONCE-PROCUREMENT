name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────
  # Backend — Python 3.12, ruff + pytest against in-memory SQLite
  # ───────────────────────────────────────────────────────────────
  backend:
    name: backend (py3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"
      SECRET_KEY: "ci-secret-key-not-used-in-prod-xxxxxxxxxxxxx"
      JWT_SECRET_KEY: "ci-jwt-secret-not-used-in-prod-yyyyyyyyyyy"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      RECEIPT_SIGNING_KEY_ID: "ci"
      ENABLE_IN_PROCESS_PROCESSOR: "True"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  # ───────────────────────────────────────────────────────────────
  # Frontend — Node 20, tsc + eslint
  # ───────────────────────────────────────────────────────────────
  frontend:
    name: frontend (node20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test (vitest)
        run: npm test --silent

      - name: Build (vite)
        run: npm run build

  # ───────────────────────────────────────────────────────────────
  # Verifier — Python 3.12, pytest
  # ───────────────────────────────────────────────────────────────
  verifier:
    name: verifier (py3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    env:
      ENV: test
      BACKEND_BASE_URL: "http://localhost:8000"
      SIGNING_KEY_ID: "ci"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verifier/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  # ───────────────────────────────────────────────────────────────
  # Extension — Node 20, vitest + build
  # ───────────────────────────────────────────────────────────────
  extension:
    name: extension (node20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # OnceTax — Node 20, typecheck + vitest + build (Cloudflare Workers / Remix)
  # ────────────────────────────────────────────────────────────
  oncetax:
    name: oncetax (node20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oncetax
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # NOTE: oncetax/package-lock.json is not yet committed. Once it
          # is, switch this job back to `npm ci` and re-enable the cache
          # via `cache: npm` + `cache-dependency-path: oncetax/package-lock.json`.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test --silent

      - name: Build
        run: npm run build
