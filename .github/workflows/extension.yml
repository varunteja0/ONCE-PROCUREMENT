name: Extension build

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

concurrency:
  group: ext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npx vitest run

      - name: Build (MV3)
        run: npm run build

      - name: Package dist as zip
        run: |
          cd dist
          zip -r ../once-extension-${{ github.sha }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: once-extension-${{ github.sha }}
          path: extension/once-extension-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
