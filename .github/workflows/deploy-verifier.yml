name: Deploy verifier (Fly)

on:
  push:
    branches: [main]
    paths:
      - "verifier/**"
      - ".github/workflows/deploy-verifier.yml"
  workflow_dispatch:

concurrency:
  group: deploy-verifier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: flyctl deploy → once-verifier
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v4

      - name: Guard — FLY_API_TOKEN present
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::warning::FLY_API_TOKEN not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up flyctl
        if: steps.guard.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.guard.outputs.skip == 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml --app once-verifier
