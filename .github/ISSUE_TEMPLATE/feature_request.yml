name: Feature request
description: Propose a new feature or enhancement.
title: "[feat] "
labels: [enhancement, triage]
assignees:
  - varunteja0
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. Keep it tight — what's the user problem,
        what's the proposed shape, what does done look like.

  - type: dropdown
    id: subproject
    attributes:
      label: Subproject
      options:
        - backend (FastAPI + Celery + Playwright)
        - frontend (React 18 + Vite)
        - extension (MV3 Chrome extension)
        - oncetax (Remix on Cloudflare Workers)
        - verifier (public Ed25519 verifier)
        - infra / CI / docs
        - cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain or business outcome motivates this? Be concrete.
      placeholder: Operators currently can't bulk-cancel queued submissions, so a bad portal credential snowballs into 30 retries.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Rough shape of the change — API surface, UI flow, data model. Doesn't have to be final.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one wins.

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Bulleted, testable acceptance criteria.
      placeholder: |
        - [ ] New endpoint POST /v1/submissions/bulk-cancel returns 202
        - [ ] Frontend "Cancel selected" action on submissions table
        - [ ] Tenant isolation test added

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links to related issues, design notes, customer quotes.
