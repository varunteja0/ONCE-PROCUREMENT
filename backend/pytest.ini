[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# ``-p no:randomly`` keeps test ordering deterministic. pytest-randomly is
# still installed and can be re-enabled per-invocation via
# ``pytest -p randomly --randomly-seed=...`` for occasional shuffle audits.
# Deterministic order is required because a handful of integration tests
# leak module-level state (lockout tracker, in-memory caches) that gets
# masked by serial ordering; tracked separately for follow-up cleanup.
addopts = -ra --strict-markers --strict-config -p no:randomly
markers =
    integration: requires nginx portal fixtures running (set RUN_INTEGRATION_TESTS=1)
    soak: long-running portal submitter soak suite (set RUN_SOAK_TESTS=1)
filterwarnings =
    # python-jose is unmaintained; it uses datetime.utcnow() which Python 3.12 deprecated.
    # Pin the suppression to jose.jwt so the same warning from our own code is still flagged.
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:jose\.jwt
